name: Bug report
description: Report unexpected behavior or a crash
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include env vars only by **name** (never paste secrets).
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), browser if relevant
    validations:
      required: false
